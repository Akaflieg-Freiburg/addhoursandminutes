name: Compile on Windows

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "fastlane/**"
      - "propaganda/**"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/webasm.yml"

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        version: '6.9.3'
    - name: Configure
      run: |
        cmake -E make_directory build
        # CMake requires forward slashes; backslashes in the install prefix
        # break the parsing of cmake_install.cmake ('\a' is an invalid escape).
        $prefix = "$env:GITHUB_WORKSPACE/addTimes" -replace '\\','/'
        qt-cmake -DQTDEPLOY=ON -DCMAKE_INSTALL_PREFIX:STRING=$prefix -S . -B build
    - name: Compile
      run: |
        cmake --build build --config Release
    - name: Install
      run: |
        cmake --build build --config Release --target install
    - name: Package
      run: |
        powershell Compress-Archive addTimes addTimes-windows64.zip
    - name: Upload to developerBuilds
      run: |
        gh release upload --clobber developerBuilds addTimes-windows64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
