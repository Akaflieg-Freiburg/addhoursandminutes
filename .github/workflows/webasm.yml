name: Compile for WebAssembly

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "fastlane/**"
      - "propaganda/**"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/windows.yml"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        # Qt 6.9 requires emscripten 3.1.70
        version: '3.1.70'
    - name: Install Qt for WebAssembly
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: '==3.2.*'
        cache: 'true'
        cache-key-prefix: 'install-qt-action-webasm'
        host: 'all_os'
        target: 'wasm'
        version: '6.9.3'
        arch: 'wasm_singlethread'
    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@v5
    - name: Configure
      run: |
        # aqt installs the wasm kit without executable bits on the bin/ scripts
        chmod +x "$QT_ROOT_DIR"/bin/*
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        cmake -E make_directory build
        $QT_ROOT_DIR/bin/qt-cmake -DCMAKE_BUILD_TYPE:STRING=Release -S . -B build -G Ninja
    - name: Compile
      run: |
        cmake --build build
    - name: Package
      run: |
        cd build/src
        zip ../../addTimes-webasm.zip qtloader.js qtlogo.svg addhoursandminutes.html addhoursandminutes.js addhoursandminutes.wasm
    - name: Upload to developerBuilds
      run: |
        gh release upload --clobber developerBuilds addTimes-webasm.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
